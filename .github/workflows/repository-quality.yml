name: Repository quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CORE_TEST_DATABASE_URL: postgres://core_runtime@127.0.0.1:5432/ensambria_core_test
      CORE_TEST_MIGRATOR_DATABASE_URL: postgres://core_migrator@127.0.0.1:5432/ensambria_core_test
      RUSTUP_TOOLCHAIN: 1.99.1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ensambria_core_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: core_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_admin -d ensambria_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - name: Validate engineering skills and agent profiles
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_engineering_skills.py

      - name: Validate Rust workspace
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          cargo fmt --all -- --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Create isolated PostgreSQL test roles and CORE schema
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT core_schema_owner TO core_migrator;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE ensambria_core_test TO core_runtime, core_migrator;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/core/migrations/bootstrap/00000000000000_core_schema.sql

      - name: Run Rust tests against PostgreSQL
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo test --locked --workspace

  security-dependencies:
    name: security-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Cargo workspace manifests
        id: cargo_manifests
        shell: bash
        run: |
          if [ -f Cargo.toml ] && [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit and cargo-deny
        if: steps.cargo_manifests.outputs.present == 'true'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit dependencies for vulnerabilities (cargo audit)
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo audit

      - name: Validate supply chain and license compliance (cargo deny)
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo deny check

      - name: Report Rust dependency audit as not applicable
        if: steps.cargo_manifests.outputs.present != 'true'
        run: |
          echo "Skipped Rust dependency audits: root Cargo.toml and Cargo.lock are not both present."
