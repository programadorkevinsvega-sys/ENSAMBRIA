        run: bash scripts/ci/check-business-module-isolation.sh


  redis-ha-integration:
    name: redis-ha-integration
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      REDIS_PASSWORD: ensambria-ci-only
      PLATFORM_REDIS_USERNAME: default
      PLATFORM_REDIS_PASSWORD: ensambria-ci-only
      PLATFORM_REDIS_POOL_SIZE: 2
      ENSAMBRIA_REDIS_REQUIRED: "true"
      DATABASE_URL: postgres://core_runtime:ensambria-ci-only@172.29.0.30:5432/ensambria_ci
      CORE_DATABASE_MAX_CONNECTIONS: "4"
      CORE_DATABASE_ACQUIRE_TIMEOUT_MS: "1500"
      CORE_MFA_ENCRYPTION_KEY_VERSION: ci-v1
      CORE_MFA_ENCRYPTION_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"
      CORE_AUTH_RATE_LIMIT_SECRET_HEX: "2222222222222222222222222222222222222222222222222222222222222222"
      CORE_PUBLIC_BASE_URL: https://business.example.test
      BUSINESS_DATABASE_URL: postgres://business_establishment_catalog_runtime:ensambria-ci-only@172.29.0.30:5432/ensambria_ci
      BUSINESS_DATABASE_MAX_CONNECTIONS: "4"
      BUSINESS_HTTP_LISTEN_ADDRESS: 127.0.0.1:22100
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal


      - name: Provision Redis Sentinel and Cluster on the GitHub runner
        run: docker compose -f infra/redis-ha/compose.ci.yml up -d

      - name: Wait for Redis nodes and create the six-node cluster
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/redis-ha/compose.ci.yml exec -T cluster-1 sh -ec '
            for attempt in $(seq 1 90); do
              ready=1
              for spec in 172.29.0.21:7001 172.29.0.22:7002 172.29.0.23:7003 172.29.0.24:7004 172.29.0.25:7005 172.29.0.26:7006; do
                host=${spec%:*}; port=${spec#*:}
                if ! redis-cli -h "$host" -p "$port" -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then ready=0; break; fi
              done
              if [ "$ready" -eq 1 ]; then exit 0; fi
              sleep 1
            done
            echo "Not all six Redis Cluster nodes became ready" >&2
            exit 1
          '
          timeout 120s docker compose -f infra/redis-ha/compose.ci.yml exec -T cluster-1 \
            redis-cli -a "$REDIS_PASSWORD" --cluster create \
            172.29.0.21:7001 172.29.0.22:7002 172.29.0.23:7003 \
            172.29.0.24:7004 172.29.0.25:7005 172.29.0.26:7006 \
            --cluster-replicas 1 --cluster-yes
          docker compose -f infra/redis-ha/compose.ci.yml exec -T sentinel-1 sh -ec '
            for attempt in $(seq 1 60); do
              master="$(redis-cli -p 26379 --raw SENTINEL get-master-addr-by-name ensambria-master 2>/dev/null | head -n 1 || true)"
              if [ -n "$master" ]; then echo "Sentinel reports master: $master"; exit 0; fi
              sleep 1
            done
            echo "Sentinel did not discover its monitored master" >&2
            exit 1
          '
          sudo sh -c 'printf "172.29.0.10 redis-master\\n172.29.0.11 redis-replica\\n" >> /etc/hosts'
      - name: Prepare PostgreSQL roles for the real BUSINESS runtime
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/redis-ha/compose.ci.yml exec -T postgres sh -ec '
            for attempt in $(seq 1 60); do
              if pg_isready -U core_admin -d ensambria_ci; then exit 0; fi
              sleep 1
            done
            exit 1
          '
          docker compose -f infra/redis-ha/compose.ci.yml exec -T postgres \
            psql -U core_admin -d ensambria_ci -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_runtime LOGIN PASSWORD 'ensambria-ci-only';"
          docker compose -f infra/redis-ha/compose.ci.yml exec -T postgres \
            psql -U core_admin -d ensambria_ci -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE business_establishment_catalog_runtime LOGIN PASSWORD 'ensambria-ci-only';"

      - name: Build the actual BUSINESS HTTP runtime
        run: cargo build --locked -p ensambria-business-runtime --bin business

      - name: Build shared Redis runtime smoke test
        run: cargo build --locked -p ensambria-shared-cache --example redis_ha_smoke

      - name: Verify BUSINESS and CORE shared-cache adapter through Sentinel
        env:
          PLATFORM_REDIS_MODE: sentinel
          PLATFORM_REDIS_SENTINEL_URLS: redis://172.29.0.12:26379;redis://172.29.0.13:26379;redis://172.29.0.14:26379
          PLATFORM_REDIS_SENTINEL_MASTER_NAME: ensambria-master
        run: cargo run --locked -p ensambria-shared-cache --example redis_ha_smoke

      - name: Start BUSINESS HTTP runtime with required Sentinel caches
        env:
          BUSINESS_HTTP_TEST_PROFILE: sentinel-primary
          PLATFORM_REDIS_MODE: sentinel
          PLATFORM_REDIS_SENTINEL_URLS: redis://172.29.0.12:26379;redis://172.29.0.13:26379;redis://172.29.0.14:26379
          PLATFORM_REDIS_SENTINEL_MASTER_NAME: ensambria-master
        run: bash scripts/ci/check-business-redis-runtime.sh


      - name: Force Sentinel master failure and verify automatic failover
        shell: bash
        env:
          PLATFORM_REDIS_MODE: sentinel
          PLATFORM_REDIS_SENTINEL_URLS: redis://172.29.0.12:26379;redis://172.29.0.13:26379;redis://172.29.0.14:26379
          PLATFORM_REDIS_SENTINEL_MASTER_NAME: ensambria-master
        run: |
          set -euo pipefail
          docker compose -f infra/redis-ha/compose.ci.yml stop redis-master
          docker compose -f infra/redis-ha/compose.ci.yml exec -T sentinel-1 sh -ec '
            promoted=false
            for attempt in $(seq 1 60); do
              master="$(redis-cli -p 26379 --raw SENTINEL get-master-addr-by-name ensambria-master 2>/dev/null | head -n 1 || true)"
              if [ "$master" = "redis-replica" ] || [ "$master" = "172.29.0.11" ]; then
                echo "Sentinel promoted replica: $master"
                promoted=true
                break
              fi
              sleep 1
            done
            test "$promoted" = true
          '
          cargo run --locked -p ensambria-shared-cache --example redis_ha_smoke
      - name: Start BUSINESS HTTP runtime after Sentinel failover
        env:
          BUSINESS_HTTP_TEST_PROFILE: sentinel-after-failover
          PLATFORM_REDIS_MODE: sentinel
          PLATFORM_REDIS_SENTINEL_URLS: redis://172.29.0.12:26379;redis://172.29.0.13:26379;redis://172.29.0.14:26379
          PLATFORM_REDIS_SENTINEL_MASTER_NAME: ensambria-master
        run: bash scripts/ci/check-business-redis-runtime.sh

      - name: Verify backend shared-cache adapter through Redis Cluster
        env:
          PLATFORM_REDIS_MODE: cluster
          PLATFORM_REDIS_CLUSTER_URLS: redis://default:ensambria-ci-only@172.29.0.21:7001;redis://default:ensambria-ci-only@172.29.0.22:7002;redis://default:ensambria-ci-only@172.29.0.23:7003;redis://default:ensambria-ci-only@172.29.0.24:7004;redis://default:ensambria-ci-only@172.29.0.25:7005;redis://default:ensambria-ci-only@172.29.0.26:7006
        run: cargo run --locked -p ensambria-shared-cache --example redis_ha_smoke

      - name: Start BUSINESS HTTP runtime with required Cluster caches
        env:
          BUSINESS_HTTP_TEST_PROFILE: cluster-primary
          PLATFORM_REDIS_MODE: cluster
          PLATFORM_REDIS_CLUSTER_URLS: redis://default:ensambria-ci-only@172.29.0.21:7001;redis://default:ensambria-ci-only@172.29.0.22:7002;redis://default:ensambria-ci-only@172.29.0.23:7003;redis://default:ensambria-ci-only@172.29.0.24:7004;redis://default:ensambria-ci-only@172.29.0.25:7005;redis://default:ensambria-ci-only@172.29.0.26:7006
        run: bash scripts/ci/check-business-redis-runtime.sh


      - name: Force Redis Cluster master failure and verify replica promotion
        shell: bash
        env:
          PLATFORM_REDIS_MODE: cluster
          PLATFORM_REDIS_CLUSTER_URLS: redis://default:ensambria-ci-only@172.29.0.25:7005;redis://default:ensambria-ci-only@172.29.0.22:7002;redis://default:ensambria-ci-only@172.29.0.23:7003;redis://default:ensambria-ci-only@172.29.0.24:7004;redis://default:ensambria-ci-only@172.29.0.26:7006
        run: |
          set -euo pipefail
          docker compose -f infra/redis-ha/compose.ci.yml stop cluster-1
          docker compose -f infra/redis-ha/compose.ci.yml exec -T cluster-5 sh -ec '
            promoted=false
            for attempt in $(seq 1 60); do
              state="$(redis-cli -a "$REDIS_PASSWORD" -p 7005 --raw CLUSTER INFO 2>/dev/null | tr -d "\\r" | grep "^cluster_state:" || true)"
              nodes="$(redis-cli -a "$REDIS_PASSWORD" -p 7005 --raw CLUSTER NODES 2>/dev/null || true)"
              myid="$(redis-cli -a "$REDIS_PASSWORD" -p 7005 --raw CLUSTER MYID 2>/dev/null || true)"
              if [ "$state" = "cluster_state:ok" ] && printf "%s\\n" "$nodes" | grep -Eq "^$myid .*master"; then
                echo "Replica 172.29.0.25:7005 was promoted and cluster state is healthy"
                promoted=true
                break
              fi
              sleep 1
            done
            test "$promoted" = true
          '
          cargo run --locked -p ensambria-shared-cache --example redis_ha_smoke

      - name: Start BUSINESS HTTP runtime after Cluster failover
        env:
          BUSINESS_HTTP_TEST_PROFILE: cluster-after-failover
          PLATFORM_REDIS_MODE: cluster
          PLATFORM_REDIS_CLUSTER_URLS: redis://default:ensambria-ci-only@172.29.0.25:7005;redis://default:ensambria-ci-only@172.29.0.22:7002;redis://default:ensambria-ci-only@172.29.0.23:7003;redis://default:ensambria-ci-only@172.29.0.24:7004;redis://default:ensambria-ci-only@172.29.0.26:7006
        run: bash scripts/ci/check-business-redis-runtime.sh

      - name: Upload BUSINESS k6 smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: business-k6-smoke-${{ github.run_id }}
          path: artifacts/k6/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Collect Redis HA diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/redis-ha/compose.ci.yml ps
          docker compose -f infra/redis-ha/compose.ci.yml logs --no-color --tail=200

      - name: Tear down Redis HA topology
        if: always()
        run: docker compose -f infra/redis-ha/compose.ci.yml down --volumes --remove-orphans

  nats-jetstream-ha-integration:
    name: nats-jetstream-ha-integration
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Start three-node NATS JetStream cluster
        run: docker compose -f infra/nats/compose.ci.yml up -d --wait

      - name: Verify replicated JetStream stream and single-node recovery
        run: bash scripts/ci/check-nats-jetstream-ha.sh

      - name: Collect NATS cluster diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/nats/compose.ci.yml ps
          docker compose -f infra/nats/compose.ci.yml logs --no-color --tail=200

      - name: Tear down NATS JetStream cluster
        if: always()
        run: docker compose -f infra/nats/compose.ci.yml down --volumes --remove-orphans

  # This is the required aggregate check configured by the main ruleset.
  # It keeps every integration/security job mandatory while allowing them
  # to execute concurrently.
  repository-quality:
    name: repository-quality
    if: always() && github.event_name != 'push' && needs.changes.result == 'success'
    needs:
      - changes
      - rust-workspace-quality
      - deployment-contract
      - protobuf-contracts
      - postgres-integration
      - redis-ha-integration
      - nats-jetstream-ha-integration
      - security-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI suite to pass
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUST_WORKSPACE_RESULT: ${{ needs.rust-workspace-quality.result }}
          DEPLOYMENT_CONTRACT_RESULT: ${{ needs.deployment-contract.result }}
          PROTOBUF_RESULT: ${{ needs.protobuf-contracts.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          REDIS_HA_RESULT: ${{ needs.redis-ha-integration.result }}
          NATS_HA_RESULT: ${{ needs.nats-jetstream-ha-integration.result }}
          SECURITY_RESULT: ${{ needs.security-dependencies.result }}
        run: |
          set -euo pipefail
          if [[ "$DOCS_ONLY" == true ]]; then
            echo "Documentation-only change: build, tests, integration and security jobs intentionally skipped."
            exit 0
          fi
          for result in "$RUST_WORKSPACE_RESULT" "$DEPLOYMENT_CONTRACT_RESULT" "$PROTOBUF_RESULT" "$POSTGRES_RESULT" "$REDIS_HA_RESULT" "$NATS_HA_RESULT" "$SECURITY_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "Required CI suite did not pass (result: $result)" >&2
              exit 1
            fi
          done

  # workflow_run uses this successful, lightweight push workflow to start
  # staging deployment. The deploy workflow checks out this exact SHA.
  main-push-gate:
    name: main-push-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the exact pushed main commit and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pushed branch and commit identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git cat-file -t "$EXPECTED_SHA")" = "commit"
      - name: Classify pushed main changes for staging deployment
        shell: bash
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=true
          if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            docs_only=false
            changed=(initial-push)
          else
            mapfile -t changed < <(git diff --name-only "$PUSH_BEFORE_SHA" "$EXPECTED_SHA")
          fi
          if (( ${#changed[@]} == 0 )); then docs_only=false; fi
          for path in "${changed[@]}"; do
            if [[ "$path" != *.md && "$path" != *.mdx && "$path" != docs/* && "$path" != documentation/* ]]; then
              docs_only=false
              break
            fi
          done
          mkdir -p "$RUNNER_TEMP/change-classification"
          printf '%s\n' "$docs_only" > "$RUNNER_TEMP/change-classification/docs_only"
          echo "Documentation-only change: $docs_only"
          printf '%s\n' "${changed[@]}"
      - name: Publish change classification for the deployment workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: change-classification
          path: ${{ runner.temp }}/change-classification/docs_only
          if-no-files-found: error
          retention-days: 2

  security-dependencies:
    name: security-dependencies
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Cargo workspace manifests
        id: cargo_manifests
        shell: bash
        run: |
          if [ -f Cargo.toml ] && [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit and cargo-deny
        if: steps.cargo_manifests.outputs.present == 'true'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit committed Cargo.lock for vulnerabilities (cargo audit)
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo audit

      - name: Validate committed dependency graph and licenses (cargo deny)
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo deny check

      - name: Report Rust dependency audit as not applicable
        if: steps.cargo_manifests.outputs.present != 'true'
        run: |
          echo "Skipped Rust dependency audits: root Cargo.toml and Cargo.lock are not both present."
