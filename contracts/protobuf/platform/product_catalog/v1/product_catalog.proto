syntax = "proto3";

package ensambria.platform.productcatalog.v1;

import "google/protobuf/timestamp.proto";

// PLATFORM is the sole authority for commercial product identity and
// declarative configuration. A result is context, never authorization.
service ProductCatalog {
  rpc GetActiveProduct(GetActiveProductRequest) returns (ProductCatalogEntry);
  rpc ResolveActiveDomain(ResolveActiveDomainRequest) returns (ProductCatalogEntry);
  rpc GetPublishedConfiguration(GetPublishedConfigurationRequest) returns (ProductConfiguration);
}

message GetActiveProductRequest {
  string product_id = 1; // Canonical UUIDv7 string.
}

message ResolveActiveDomainRequest {
  string domain_name = 1; // Exact normalized domain; never an auth credential.
}

message GetPublishedConfigurationRequest {
  string product_id = 1;
  uint32 configuration_version = 2;
}

message ProductCatalogEntry {
  string product_id = 1;
  string product_key = 2;
  string display_name = 3;
  string brand_name = 4;
  uint32 configuration_version = 5;
  string configuration_schema_version = 6;
  repeated ProductDomain domains = 7;
  repeated ProductMarket markets = 8;
  repeated ProductSurface surfaces = 9;
  repeated ProductCapability capabilities = 10;
  google.protobuf.Timestamp published_at = 11;
}

message ProductConfiguration {
  string product_id = 1;
  uint32 version = 2;
  string schema_version = 3;
  bytes canonical_json = 4; // JSON object, validated against schema_version.
  google.protobuf.Timestamp published_at = 5;
}

message ProductDomain {
  string domain_name = 1;
  string status = 2;
}

message ProductMarket {
  string country_code = 1;
  string currency_code = 2;
  string locale = 3;
  string status = 4;
}

message ProductSurface {
  string surface_code = 1;
  uint32 configuration_version = 2;
  string status = 3;
}

message ProductCapability {
  string capability_code = 1;
  string contract_version = 2;
  string implementation_status = 3;
  string product_status = 4;
}
