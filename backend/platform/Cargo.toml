[package]
name = "ensambria-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
ensambria-shared-cache = { path = "../shared-cache" }
ensambria-platform-contract = { path = "../platform-contract" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.9", default-features = false, features = ["router", "tls-ring", "transport"] }
tracing = "0.1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "json"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
