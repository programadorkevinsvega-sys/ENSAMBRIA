name: ENSAMBRIA staging capacity test

on:
  workflow_dispatch:
    inputs:
      method:
        description: HTTP method for the functional API endpoint
        required: true
        default: GET
        type: choice
        options: [GET, POST, PUT, PATCH, DELETE]
      arrival_rate:
        description: Target requests per second
        required: true
        default: "100"
        type: string
      duration:
        description: Test duration (for example 5m)
        required: true
        default: 5m
        type: string

permissions:
  contents: read

jobs:
  k6-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate staging secrets
        env:
          TARGET_URL: ${{ secrets.ENSAMBRIA_STAGING_FUNCTIONAL_URL }}
          BEARER_TOKEN: ${{ secrets.ENSAMBRIA_STAGING_TEST_TOKEN }}
          BODY_JSON: ${{ secrets.ENSAMBRIA_STAGING_TEST_BODY_JSON }}
        run: |
          test -n "$TARGET_URL"
          test -n "$BEARER_TOKEN"
          case "$TARGET_URL" in
            https://*) ;;
            *) echo "Staging functional endpoint must use HTTPS"; exit 1 ;;
          esac
          case "$TARGET_URL" in
            */health|*/ready|*/live|*/metrics) echo "Health endpoints are forbidden load targets"; exit 1 ;;
          esac

      - name: Run functional API capacity test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-tests/k6/functional-api.js
        env:
          TARGET_URL: ${{ secrets.ENSAMBRIA_STAGING_FUNCTIONAL_URL }}
          BEARER_TOKEN: ${{ secrets.ENSAMBRIA_STAGING_TEST_TOKEN }}
          HEADERS_JSON: ${{ secrets.ENSAMBRIA_STAGING_TEST_HEADERS_JSON }}
          BODY_JSON: ${{ secrets.ENSAMBRIA_STAGING_TEST_BODY_JSON }}
          METHOD: ${{ inputs.method }}
          ARRIVAL_RATE: ${{ inputs.arrival_rate }}
          DURATION: ${{ inputs.duration }}
          PREALLOCATED_VUS: "100"
          MAX_VUS: "1000"
