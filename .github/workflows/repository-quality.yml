name: Repository quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - name: Validate engineering skills and agent profiles
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_engineering_skills.py

      - name: Validate Rust workspace
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          cargo fmt --all
          echo 'RUSTFMT_SERVICE_BEGIN'
          cat backend/core/src/identity_authentication/service.rs
          echo 'RUSTFMT_SERVICE_END'
          cargo fmt --all -- --check
          set +e
          cargo check --workspace --all-targets
          check_status=$?
          set -e
          echo 'LOCK_DIFF_BEGIN'
          git diff -- Cargo.lock
          echo 'LOCK_DIFF_END'
          test "$check_status" -eq 0
          cargo clippy --locked --workspace --all-targets -- -D warnings


  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORE_TEST_DATABASE_URL: postgres://core_runtime@127.0.0.1:5432/ensambria_core_test
      CORE_TEST_MIGRATOR_DATABASE_URL: postgres://core_migrator@127.0.0.1:5432/ensambria_core_test
      PLATFORM_TEST_DATABASE_URL: postgres://platform_runtime@127.0.0.1:5432/ensambria_core_test
      RUSTUP_TOOLCHAIN: 1.99.1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ensambria_core_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: core_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_admin -d ensambria_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Create isolated PostgreSQL test roles and CORE and PLATFORM schemas
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT core_schema_owner TO core_migrator;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE ensambria_core_test TO core_runtime, core_migrator;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/core/migrations/bootstrap/00000000000000_core_schema.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE platform_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE platform_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE ensambria_core_test TO platform_runtime;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT platform_schema_owner TO core_migrator;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/platform/migrations/bootstrap/00000000000000_platform_schema.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "SET ROLE platform_schema_owner" \
            -f backend/platform/migrations/20261122000001_platform_product_catalog.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE platform_schema_owner;
          BEGIN;
          INSERT INTO platform.products (id, product_key, display_name, brand_name, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'ensambria-core', 'ENSAMBRIA Core', 'ENSAMBRIA', 'draft');
          INSERT INTO platform.product_configurations (product_id, version, schema_version, configuration, status, published_at)
          VALUES (
              '018f0f2a-7b3c-7abc-8def-0123456789ab',
              1,
              'product-config.v1',
              '{"branding":{"displayName":"ENSAMBRIA Core","brandName":"ENSAMBRIA"},"domains":["shop.example.test"],"markets":[{"countryCode":"CO","currencyCode":"COP","locale":"es-CO"}],"surfaces":[{"code":"operator.web","configurationVersion":1}],"capabilities":[{"code":"identity.auth","contractVersion":"v1"}]}'::jsonb,
              'published',
              clock_timestamp()
          );
          UPDATE platform.products
             SET status = 'active', published_configuration_version = 1, updated_at = clock_timestamp()
           WHERE id = '018f0f2a-7b3c-7abc-8def-0123456789ab';
          INSERT INTO platform.product_domains (id, product_id, domain_name, status, verified_at)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ac', '018f0f2a-7b3c-7abc-8def-0123456789ab', 'shop.example.test', 'active', clock_timestamp());
          INSERT INTO platform.product_markets (product_id, country_code, currency_code, locale, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'CO', 'COP', 'es-CO', 'enabled');
          INSERT INTO platform.product_surfaces (product_id, surface_code, configuration_version, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'operator.web', 1, 'enabled');
          INSERT INTO platform.capability_catalog (capability_code, contract_version, implementation_status)
          VALUES ('identity.auth', 'v1', 'available');
          INSERT INTO platform.product_capabilities (product_id, capability_code, configuration_version, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'identity.auth', 1, 'enabled');
          COMMIT;
          SQL
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "SET ROLE platform_runtime; SELECT count(*) FROM platform.active_product_catalog;"

      - name: Refresh locked dependencies and patch known advisory
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo update -p url --precise 2.5.9

      - name: Run Rust tests against PostgreSQL
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo test --locked --workspace

  security-dependencies:
    name: security-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect Cargo workspace manifests
        id: cargo_manifests
        shell: bash
        run: |
          if [ -f Cargo.toml ] && [ -f Cargo.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-audit and cargo-deny
        if: steps.cargo_manifests.outputs.present == 'true'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-audit,cargo-deny

      - name: Refresh locked dependencies and patch known advisory
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo update -p url --precise 2.5.9

      - name: Audit dependencies for vulnerabilities (cargo audit)
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo audit

      - name: Validate supply chain and license compliance (cargo deny)
        if: steps.cargo_manifests.outputs.present == 'true'
        run: cargo deny check

      - name: Report Rust dependency audit as not applicable
        if: steps.cargo_manifests.outputs.present != 'true'
        run: |
          echo "Skipped Rust dependency audits: root Cargo.toml and Cargo.lock are not both present."
