name: ENSAMBRIA PostgreSQL administration

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: postgres-admin-\${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  postgres-admin:
    if: >-
      github.event.issue.pull_request != null &&
      (github.event.comment.body == '/ensambria postgres provision' ||
       github.event.comment.body == '/ensambria postgres verify')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: core-staging
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: \${{ github.token }}
      GH_REPOSITORY: \${{ github.repository }}
      PR_NUMBER: \${{ github.event.issue.number }}
      COMMENT_ACTOR: \${{ github.event.comment.user.login }}
      COMMAND: \${{ github.event.comment.body }}
      POSTGRES_HOST: \${{ vars.CORE_STAGING_POSTGRES_HOST || 'postgres' }}
      POSTGRES_SSH_USER: ubuntu

    steps:
      - name: Validate PR target and authorize PostgreSQL operator
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$COMMAND" == '/ensambria postgres provision' || "$COMMAND" == '/ensambria postgres verify' ]]
          [[ "$POSTGRES_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          pr="$(gh api "repos/$GH_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.state' <<<"$pr")" == open ]]
          [[ "$(jq -r '.base.ref' <<<"$pr")" == main ]]
          [[ "$(jq -r '.head.repo.full_name // empty' <<<"$pr")" == "$GH_REPOSITORY" ]]
          permission="$(gh api "repos/$GH_REPOSITORY/collaborators/$COMMENT_ACTOR/permission" --jq '.permission')"
          case "$permission" in admin|maintain) ;; *) echo "::error::Requires repository admin or maintain permission."; exit 1 ;; esac
          echo "Authorized operator: $COMMENT_ACTOR ($permission)"

      - name: Check out trusted administration scripts from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Validate SSH and Tailscale credentials
        env:
          DEPLOY_SSH_KEY: \${{ secrets.DEPLOY_SSH_KEY }}
          TS_OAUTH_CLIENT_ID: \${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: \${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_SSH_KEY" && -n "$TS_OAUTH_CLIENT_ID" && -n "$TS_OAUTH_SECRET" ]]
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Connect to the existing staging tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: \${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: \${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:core-staging-deployer
          version: 1.104.4
          hostname: github-postgres-admin
          ping: \${{ vars.CORE_STAGING_POSTGRES_HOST || 'postgres' }}

      - name: Provision or verify PostgreSQL directly on the database VM
        id: postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh_args=(-i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new)
          target="\${POSTGRES_SSH_USER}@\${POSTGRES_HOST}"
          if [[ "$COMMAND" == '/ensambria postgres provision' ]]; then
            script=backend/core/deployment/provision-module-ownership.sql
            mode=provision
          else
            script=backend/core/deployment/verify-module-ownership.sql
            mode=verify
          fi
          test -s "$script"
          echo "Executing PostgreSQL $mode on $POSTGRES_HOST / crm-postgres / ensambria"
          ssh "\${ssh_args[@]}" "$target" \
            "sudo -n docker exec -i --user postgres crm-postgres psql --no-psqlrc --set ON_ERROR_STOP=1 --username postgres --dbname ensambria" \
            < "$script"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized result to the requesting PR
        if: success()
        env:
          MODE: \${{ steps.postgres.outputs.mode }}
        run: |
          set -Eeuo pipefail
          body="**ENSAMBRIA PostgreSQL $MODE: SUCCESS**"$'\n\n'"- Operator: @$COMMENT_ACTOR"$'\n'"- Target: $POSTGRES_HOST / crm-postgres / ensambria"$'\n'"- Direct SSH over the existing Tailscale network"$'\n'"- Application deploy, application migrations, passwords, and .env: not touched"$'\n\n'"Catalog SQL completed with ON_ERROR_STOP=1."
          gh api "repos/$GH_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body"

      - name: Remove administrative SSH key
        if: always()
        run: rm -f -- "$HOME/.ssh/id_ed25519"
