name: Repository quality

on:
  pull_request:
    branches:
      - main
      - feat/core-identity-tenancy-1-2
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify documentation-only changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            git cat-file -e "$base^{commit}"
            mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            base="$MERGE_BASE_SHA"
            git cat-file -e "$base^{commit}"
            mapfile -t changed < <(git diff --name-only "$base"...HEAD)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
              docs_only=false
              changed=(initial-push)
            else
              mapfile -t changed < <(git diff --name-only "$PUSH_BEFORE_SHA" "$EXPECTED_SHA")
            fi
          else
            docs_only=false
            changed=(manual-or-unsupported-event)
          fi
          if (( ${#changed[@]} == 0 )); then docs_only=false; fi
          for path in "${changed[@]}"; do
            if [[ "$path" != *.md && "$path" != *.mdx && "$path" != docs/* && "$path" != documentation/* ]]; then
              docs_only=false
              break
            fi
          done
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Documentation-only change: %s\n' "$docs_only"
          printf '%s\n' "${changed[@]}"
  # The full suite runs before integration (PR / merge queue / manual runs).
  # A push to main only gets a cheap SHA gate; the protected PR already ran
  # the full suite, so do not execute the same expensive matrix a second time.
  rust-workspace-quality:
    name: rust-workspace-quality
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # For pull_request, checkout's default GITHUB_SHA is the synthetic
      # PR merge commit. This validates the exact result that would enter main.
      # Pushes to main use the lightweight main-push-gate job below instead.
      - name: Check out tested revision (PR merge result or pushed commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - name: Validate engineering skills and agent profiles
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_engineering_skills.py

      - name: Check Rust formatting (cargo fmt)
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo fmt --all -- --check

      - name: Compile Rust workspace (cargo check)
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo check --locked --workspace --all-targets

      - name: Lint Rust workspace (cargo clippy)
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Enforce modular architecture and ownership contracts
        run: cargo xtask architecture


  protobuf-contracts:
    name: protobuf-contracts
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history for compatibility checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint versioned Protobuf contracts with Buf
        run: docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:1.50.0 lint
      - name: Reject breaking Protobuf changes against main
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace bufbuild/buf:1.50.0
          breaking --against 'https://github.com/programadorkevinsvega-sys/ENSAMBRIA.git#branch=main,subdir=contracts/protobuf'

  deployment-contract:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    name: deployment-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate staging deployment scripts and systemd contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n backend/core/deployment/deploy-staging.sh
          grep -Fq 'flock -n 9' backend/core/deployment/deploy-staging.sh
          grep -Fq 'validate_staging_package.py' backend/core/deployment/deploy-staging.sh
          grep -Fq 'SHA256SUMS' backend/core/deployment/deploy-staging.sh
          grep -Fq 'SHA256SUMS' .github/workflows/core-staging-deploy.yml
          grep -Fq 'scripts/validate_staging_package.py' .github/workflows/core-staging-deploy.yml
          grep -Fq 'StartLimitBurst=5' backend/business/deployment/ensambria-business.service
          grep -Fq 'chmod 0550' backend/core/deployment/deploy-staging.sh
          git fetch --no-tags origin main:refs/remotes/origin/main
          mapfile -t changed_migrations < <(git diff --name-only refs/remotes/origin/main...HEAD -- backend/core/migrations backend/business/migrations)
          for migration in "${changed_migrations[@]}"; do
            [[ -f "$migration" ]] || { echo "Migration files cannot be deleted during automatic deployment: $migration" >&2; exit 1; }
          done
          if (( ${#changed_migrations[@]} )); then
            python3 scripts/check_expand_contract_migrations.py "${changed_migrations[@]}"
          else
            echo "No migration SQL changed; compatibility guard not required."
          fi
          python3 -m unittest discover -s scripts -p 'test_staging_package_validation.py'
          python3 -m unittest discover -s scripts -p 'test_expand_contract_migration_policy.py'
          test -s backend/business/deployment/ensambria-business.service
          test -s backend/business/deployment/ensambria-business-migrate.service
          test -s backend/business/src/bin/business-migrate.rs
          test -s backend/business/deployment/provision-business-roles.sql
          grep -Fq 'CORE_HEALTH_LISTEN_ADDRESS=127.0.0.1:22080' .env.example
          grep -Fq 'CORE_METRICS_LISTEN_ADDRESS=127.0.0.1:22090' .env.example
          grep -Fq 'BUSINESS_HTTP_LISTEN_ADDRESS=127.0.0.1:22100' .env.example
          ! grep -Fq '127.0.0.1:8080/health' backend/core/deployment/deploy-staging.sh
          test -s backend/core/deployment/ensambria-env-reload.service
          test -s backend/core/deployment/ensambria-env-reload.path
          grep -Fqx 'EnvironmentFile=/etc/apps/ensambria/core/.env' backend/business/deployment/ensambria-business.service
          grep -Fqx 'ExecStart=/opt/apps/ensambria/current/business' backend/business/deployment/ensambria-business.service
          grep -Fqx 'PathChanged=/etc/apps/ensambria/core/.env' backend/core/deployment/ensambria-env-reload.path
          grep -Fqx 'PathModified=/etc/apps/ensambria/core' backend/core/deployment/ensambria-env-reload.path
          grep -Fq 'ensambria-business.service' backend/core/deployment/deploy-staging.sh
          grep -Fq 'ensambria-business-migrate.service' backend/core/deployment/deploy-staging.sh
          grep -Fq 'business-migrate' .github/workflows/core-staging-deploy.yml
          grep -Fq 'ensambria-core-email-worker.service' backend/core/deployment/deploy-staging.sh
          grep -Fq 'ensambria-env-reload.path' backend/core/deployment/deploy-staging.sh
          grep -Fq 'business-migrations' .github/workflows/core-staging-deploy.yml
          grep -Fq 'backend/business/deployment/ensambria-business.service' .github/workflows/core-staging-deploy.yml
          grep -Fq 'core-staging.tar.gz' .github/workflows/core-staging-deploy.yml
          grep -Fq 'core-staging.tar.gz' backend/core/deployment/deploy-staging.sh
          # Keep the main push path cheap while preserving the PR aggregate gate.
          grep -Fq 'main-push-gate:' .github/workflows/repository-quality.yml
          grep -Fq 'classify changed files' .github/workflows/repository-quality.yml
          grep -Fq "needs.changes.outputs.docs_only != 'true'" .github/workflows/repository-quality.yml
          grep -Fq 'change-classification' .github/workflows/repository-quality.yml
          grep -Fq 'needs.change-classification.outputs.docs_only !=' .github/workflows/core-staging-deploy.yml
          grep -Fq "if: github.event_name == 'push'" .github/workflows/repository-quality.yml
          grep -Fq 'needs:' .github/workflows/repository-quality.yml
          grep -Fq 'ref: ${{ github.event.workflow_run.head_sha }}' .github/workflows/core-staging-deploy.yml

  postgres-integration:
    name: postgres-integration
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CORE_TEST_DATABASE_URL: postgres://core_runtime@127.0.0.1:5432/ensambria_core_test
      CORE_TEST_MIGRATOR_DATABASE_URL: postgres://core_migrator@127.0.0.1:5432/ensambria_core_test
      CORE_EMAIL_WORKER_DATABASE_URL: postgres://core_email_worker@127.0.0.1:5432/ensambria_core_test
      CORE_OUTBOX_DATABASE_URL: postgres://core_outbox_relay@127.0.0.1:5432/ensambria_core_test
      CORE_TENANT_DATABASE_URL: postgres://core_runtime@127.0.0.1:5432/ensambria_core_test
      PLATFORM_EVENT_DATABASE_URL: postgres://platform_tenant_onboarding_runtime@127.0.0.1:5432/ensambria_core_test
      PLATFORM_VERIFY_DATABASE_URL: postgres://core_admin@127.0.0.1:5432/ensambria_core_test
      PLATFORM_TEST_DATABASE_URL: postgres://platform_product_catalog_runtime@127.0.0.1:5432/ensambria_core_test
      BUSINESS_DATABASE_URL: postgres://business_establishment_catalog_runtime@127.0.0.1:5432/ensambria_core_test
      ENSAMBRIA_TEST_REDIS_URL: redis://127.0.0.1:6379/
      RUSTUP_TOOLCHAIN: 1.99.1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ensambria_core_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: core_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core_admin -d ensambria_core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Create isolated PostgreSQL test roles and CORE and PLATFORM schemas
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT core_schema_owner TO core_migrator;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_email_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_outbox_relay LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "GRANT CONNECT ON DATABASE ensambria_core_test TO core_runtime, core_migrator, core_email_worker, core_outbox_relay;"
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/core/migrations/bootstrap/00000000000000_core_schema.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/core/deployment/provision-module-ownership.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/platform/migrations/bootstrap/00000000000000_platform_schema.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "SET ROLE platform_product_catalog_schema_owner" \
            -f backend/platform/migrations/20261122000001_platform_product_catalog.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "SET ROLE platform_tenant_onboarding_schema_owner" \
            -f backend/platform/migrations/20261122000002_platform_tenant_onboarding_inbox.sql
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE platform_product_catalog_schema_owner;
          BEGIN;
          INSERT INTO platform_product_catalog.products (id, product_key, display_name, brand_name, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'ensambria-core', 'ENSAMBRIA Core', 'ENSAMBRIA', 'draft');
          INSERT INTO platform_product_catalog.product_configurations (product_id, version, schema_version, configuration, status, published_at)
          VALUES (
              '018f0f2a-7b3c-7abc-8def-0123456789ab',
              1,
              'product-config.v1',
              '{"branding":{"displayName":"ENSAMBRIA Core","brandName":"ENSAMBRIA"},"domains":["shop.example.test"],"markets":[{"countryCode":"CO","currencyCode":"COP","locale":"es-CO"}],"surfaces":[{"code":"operator.web","configurationVersion":1}],"capabilities":[{"code":"identity.auth","contractVersion":"v1"}]}'::jsonb,
              'published',
              clock_timestamp()
          );
          UPDATE platform_product_catalog.products
             SET status = 'active', published_configuration_version = 1, updated_at = clock_timestamp()
           WHERE id = '018f0f2a-7b3c-7abc-8def-0123456789ab';
          INSERT INTO platform_product_catalog.product_domains (id, product_id, domain_name, status, verified_at)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ac', '018f0f2a-7b3c-7abc-8def-0123456789ab', 'shop.example.test', 'active', clock_timestamp());
          INSERT INTO platform_product_catalog.product_markets (product_id, country_code, currency_code, locale, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'CO', 'COP', 'es-CO', 'enabled');
          INSERT INTO platform_product_catalog.product_surfaces (product_id, surface_code, configuration_version, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'operator.web', 1, 'enabled');
          INSERT INTO platform_product_catalog.capability_catalog (capability_code, contract_version, implementation_status)
          VALUES ('identity.auth', 'v1', 'available');
          INSERT INTO platform_product_catalog.product_capabilities (product_id, capability_code, configuration_version, status)
          VALUES ('018f0f2a-7b3c-7abc-8def-0123456789ab', 'identity.auth', 1, 'enabled');
          COMMIT;
          SQL
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -c "SET ROLE platform_product_catalog_runtime; SELECT count(*) FROM platform_product_catalog.active_product_catalog;"

      - name: Provision isolated PostgreSQL module schemas and roles
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: |
          set -euo pipefail
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            -v ON_ERROR_STOP=1 \
            -f backend/core/deployment/provision-module-ownership.sql
          TEST_DATABASE_URL="postgres://core_admin@127.0.0.1:5432/ensambria_core_test" \
            bash scripts/ci/check-module-schema-isolation.sh

      - name: Apply CORE migrations twice and verify rollback compatibility
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        env:
          MIGRATIONS_DATABASE_URL: postgres://core_migrator@127.0.0.1:5432/ensambria_core_test
        run: |
          set -euo pipefail
          cargo run --locked --package ensambria-core --bin core-migrate -- backend/core/migrations
          cargo run --locked --package ensambria-core --bin core-migrate -- backend/core/migrations
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" -v ON_ERROR_STOP=1 <<'SQL'
          DO $body$
          BEGIN
              IF to_regprocedure('core.auth_rotate_refresh_token(bytea,uuid,bytea,timestamp with time zone)') IS NULL THEN
                  RAISE EXCEPTION 'previous CORE release refresh-token function contract is missing';
              END IF;
              IF to_regprocedure('core.auth_rotate_refresh_token(bytea,uuid,bytea,timestamp with time zone,bytea,timestamp with time zone)') IS NULL THEN
                  RAISE EXCEPTION 'current CORE access-token refresh function contract is missing';
              END IF;
          END
          $body$;
          SQL
      - name: Run Rust tests against PostgreSQL
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        run: cargo test --locked --workspace
      - name: Start real NATS JetStream cluster for CORE to PLATFORM flow
        run: docker compose -f infra/nats/compose.ci.yml up -d --wait
      - name: Verify CORE to PLATFORM redelivery and crash recovery end to end
        env:
          ENSAMBRIA_NATS_URL: nats://127.0.0.1:4222
        run: bash scripts/ci/check-core-platform-tenant-onboarding.sh
      - name: Tear down end-to-end NATS cluster
        if: always()
        run: docker compose -f infra/nats/compose.ci.yml down --volumes --remove-orphans

      - name: Verify tenant Outbox and PLATFORM Inbox schema permissions and idempotency
        if: hashFiles('Cargo.toml', 'Cargo.lock') != ''
        shell: bash
        run: |
          set -euo pipefail
          psql "postgres://core_admin@127.0.0.1:5432/ensambria_core_test" -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE core_runtime;
          BEGIN;
          SELECT set_config('app.tenant_id', '018f0f2a-7b3c-7abc-8def-0123456789ae', true);
          INSERT INTO core.outbox_events (
              event_id, event_type, schema_version, aggregate_type, aggregate_id,
              aggregate_version, product_id, product_config_version, correlation_id,
              payload, occurred_at
          ) VALUES (
              '018f0f2a-7b3c-7abc-8def-0123456789b0',
              'core.tenant.created.v1', 1, 'tenant',
              '018f0f2a-7b3c-7abc-8def-0123456789ae', 1,
              '018f0f2a-7b3c-7abc-8def-0123456789ab', 1,
              '018f0f2a-7b3c-7abc-8def-0123456789af',
              '{"tenantId":"018f0f2a-7b3c-7abc-8def-0123456789ae","productId":"018f0f2a-7b3c-7abc-8def-0123456789ab","productConfigVersion":1}'::jsonb,
              clock_timestamp()
          );
          COMMIT;
          RESET ROLE;
          SET ROLE core_outbox_relay;
          DO $body$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM core.outbox_events
                   WHERE event_id = '018f0f2a-7b3c-7abc-8def-0123456789b0'
              ) THEN
                  RAISE EXCEPTION 'CORE outbox relay cannot read the committed event';
              END IF;
          END
          $body$;
          RESET ROLE;
          SQL
          psql "$CORE_TEST_MIGRATOR_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $body$
          BEGIN
              IF NOT has_table_privilege('core_runtime', (SELECT c.oid FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'core' AND c.relname = 'outbox_events'), 'INSERT') THEN
                  RAISE EXCEPTION 'core_runtime must append Outbox rows in the tenant transaction';
              END IF;
              IF NOT has_table_privilege('core_outbox_relay', (SELECT c.oid FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'core' AND c.relname = 'outbox_events'), 'SELECT,UPDATE') THEN
                  RAISE EXCEPTION 'core_outbox_relay must claim and publish Outbox rows';
              END IF;
              IF has_table_privilege('core_outbox_relay', (SELECT c.oid FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'core' AND c.relname = 'outbox_events'), 'INSERT') THEN
                  RAISE EXCEPTION 'core_outbox_relay must not create business events';
              END IF;
              IF NOT has_table_privilege('platform_tenant_onboarding_runtime', (SELECT c.oid FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'platform_tenant_onboarding' AND c.relname = 'inbox_messages'), 'INSERT,UPDATE,SELECT') THEN
                  RAISE EXCEPTION 'platform_tenant_onboarding_runtime must maintain Inbox records';
              END IF;
              IF NOT has_table_privilege('platform_tenant_onboarding_runtime', (SELECT c.oid FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'platform_tenant_onboarding' AND c.relname = 'tenant_onboardings'), 'INSERT,SELECT') THEN
                  RAISE EXCEPTION 'platform_tenant_onboarding_runtime must create and inspect onboarding records';
              END IF;
              IF has_table_privilege('platform_tenant_onboarding_runtime', (SELECT c.oid FROM pg_catalog.pg_class c JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'platform_tenant_onboarding' AND c.relname = 'tenant_onboardings'), 'DELETE') THEN
                  RAISE EXCEPTION 'platform_tenant_onboarding_runtime must not delete onboarding history';
              END IF;
              IF has_schema_privilege('platform_product_catalog_runtime', 'platform_tenant_onboarding', 'USAGE')
                 OR has_schema_privilege('platform_tenant_onboarding_runtime', 'platform_product_catalog', 'USAGE') THEN
                  RAISE EXCEPTION 'PLATFORM runtime roles must not cross schema ownership boundaries';
              END IF;
              IF NOT has_table_privilege('platform_product_catalog_runtime', 'platform_product_catalog.active_product_catalog', 'SELECT')
                 OR has_table_privilege('platform_product_catalog_runtime', 'platform_product_catalog.products', 'INSERT,UPDATE,DELETE') THEN
                  RAISE EXCEPTION 'PLATFORM product runtime grants are not read-only';
