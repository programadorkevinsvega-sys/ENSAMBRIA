name: ENSAMBRIA staging deploy

on:
  workflow_run:
    workflows:
      - Repository quality
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: core-staging-deploy
  cancel-in-progress: false

jobs:
  change-classification:
    name: check whether staging deployment is needed
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      docs_only: ${{ steps.read.outputs.docs_only }}
    steps:
      - name: Download classification from the exact source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/change-classification"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name change-classification --dir "$RUNNER_TEMP/change-classification"
      - name: Read documentation-only classification
        id: read
        run: |
          set -euo pipefail
          value="$(cat "$RUNNER_TEMP/change-classification/docs_only")"
          [[ "$value" == true || "$value" == false ]]
          echo "docs_only=$value" >> "$GITHUB_OUTPUT"
          echo "Documentation-only push: $value"

  deploy:
    needs: change-classification
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.change-classification.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: core-staging
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CORE_STAGING_HOST: ${{ vars.CORE_STAGING_HOST }}
      CORE_STAGING_SSH_USER: ubuntu

    steps:
      - name: Check out the exact CI-validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify the checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install the pinned Rust toolchain and musl target
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add x86_64-unknown-linux-musl --toolchain 1.99.1

      - name: Build all staging services
        run: >-
          cargo build --locked --release --package ensambria-core
          --bin core --bin core-migrate --bin core-email-worker
          --package ensambria-business --bin business --bin business-migrate
          --target x86_64-unknown-linux-musl

      - name: Package every runtime binary and migration SQL
        id: package
        shell: bash
        run: |
          package="${RUNNER_TEMP}/core-staging.tar.gz"
          artifacts="$(mktemp -d "${RUNNER_TEMP}/ensambria-artifacts.XXXXXX")"
          trap 'rm -rf -- "$artifacts"' EXIT
          for binary in core core-migrate core-email-worker business business-migrate; do
            install -m 0750 "target/x86_64-unknown-linux-musl/release/$binary" "$artifacts/$binary"
          done
          mkdir -p "$artifacts/migrations" "$artifacts/business-migrations/bootstrap"
          while IFS= read -r -d '' file; do
            install -m 0640 "$file" "$artifacts/migrations/"
          done < <(find backend/core/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z)
          while IFS= read -r -d '' file; do
            relative="${file#backend/business/migrations/}"
            install -D -m 0640 "$file" "$artifacts/business-migrations/$relative"
          done < <(find backend/business/migrations -type f -name '*.sql' -print0 | sort -z)
          test -s "$artifacts/core"
          test -s "$artifacts/business"
          test -n "$(find "$artifacts/migrations" -type f -name '*.sql' -print -quit)"
          test -n "$(find "$artifacts/business-migrations" -type f -name '*.sql' -print -quit)"
          (
            cd "$artifacts"
            find core core-migrate core-email-worker business business-migrate migrations business-migrations -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )
          tar --create --gzip --file "$package" --directory "$artifacts" \
            SHA256SUMS core core-migrate core-email-worker business business-migrate migrations business-migrations
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Validate staging connection settings
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          [[ -n "$CORE_STAGING_HOST" ]]
          [[ "$CORE_STAGING_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ -n "$DEPLOY_SSH_KEY" ]]
          [[ -n "$TS_OAUTH_CLIENT_ID" ]]
          [[ -n "$TS_OAUTH_SECRET" ]]
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Connect runner to the staging tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:core-staging-deployer
          version: 1.104.4
          hostname: github-core-staging
          ping: ${{ vars.CORE_STAGING_HOST }}

      - name: Deploy all ENSAMBRIA services and apply both schemas
        env:
          REMOTE_DIRECTORY: /tmp/ensambria-core-${{ github.run_id }}-${{ github.run_attempt }}
          CORE_PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          cleanup_remote_directory() {
            ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o ConnectTimeout=20 \
              -o StrictHostKeyChecking=accept-new \
              "${CORE_STAGING_SSH_USER}@${CORE_STAGING_HOST}" \
              "rm -rf -- '${REMOTE_DIRECTORY}'"
          }
          trap cleanup_remote_directory EXIT
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${CORE_STAGING_SSH_USER}@${CORE_STAGING_HOST}" \
            "mkdir -m 0700 '${REMOTE_DIRECTORY}'"
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "$CORE_PACKAGE" \
            backend/core/deployment/deploy-staging.sh \
            scripts/validate_staging_package.py \
            backend/core/deployment/ensambria-core.service \
            backend/core/deployment/ensambria-core-migrate.service \
            backend/core/deployment/ensambria-core-email-worker.service \
            backend/business/deployment/ensambria-business.service \
            backend/business/deployment/ensambria-business-migrate.service \
            backend/core/deployment/ensambria-env-reload.service \
            backend/core/deployment/ensambria-env-reload.path \
            "${CORE_STAGING_SSH_USER}@${CORE_STAGING_HOST}:${REMOTE_DIRECTORY}/"
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${CORE_STAGING_SSH_USER}@${CORE_STAGING_HOST}" \
            "sudo -n bash '${REMOTE_DIRECTORY}/deploy-staging.sh' '${REMOTE_DIRECTORY}'"

      - name: Verify every ENSAMBRIA staging service on the VM
        run: |
          # Reuse the existing staging tailnet access established by the deploy job.
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            "${CORE_STAGING_SSH_USER}@${CORE_STAGING_HOST}" \
            "sudo -n bash -s" <<'REMOTE'
          set -Eeuo pipefail
          env_file=/etc/apps/ensambria/core/.env
          services=(ensambria-core.service ensambria-core-email-worker.service ensambria-business.service)
          for service in "${services[@]}"; do
            systemctl is-enabled --quiet "$service"
            systemctl is-active --quiet "$service"
            printf '%s=active-and-enabled\n' "$service"
          done
          for binary in core core-migrate core-email-worker business business-migrate; do
            test -s "/opt/apps/ensambria/current/$binary"
            test -x "/opt/apps/ensambria/current/$binary"
            printf '%s=present-and-executable\n' "$binary"
          done
          systemctl is-enabled --quiet ensambria-env-reload.path
          systemctl is-active --quiet ensambria-env-reload.path
          printf 'env_change_watcher=active-and-enabled\n'
          service=ensambria-business.service
          exec_start="$(systemctl show "$service" --property=ExecStart --value 2>/dev/null || true)"
          binary=""
          if [[ "$exec_start" =~ path=([^[:space:];]+) ]]; then binary="${BASH_REMATCH[1]}"; fi
          active="$(systemctl is-active "$service" 2>/dev/null || true)"
          enabled="$(systemctl is-enabled "$service" 2>/dev/null || true)"
          printf 'business_service_active=%s\n' "${active:-missing}"
          printf 'business_service_enabled=%s\n' "${enabled:-missing}"
          printf 'business_binary_present=%s\n' "$([[ -x "$binary" ]] && echo yes || echo no)"
          printf 'shared_env_present=%s\n' "$([[ -s "$env_file" ]] && echo yes || echo no)"
          if [[ -s "$env_file" ]]; then
            for name in DATABASE_URL BUSINESS_DATABASE_URL CORE_DATABASE_MAX_CONNECTIONS CORE_DATABASE_ACQUIRE_TIMEOUT_MS CORE_PUBLIC_BASE_URL CORE_MFA_ENCRYPTION_KEY_VERSION CORE_MFA_ENCRYPTION_KEY_HEX CORE_AUTH_RATE_LIMIT_SECRET_HEX; do
              if grep -qE "^${name}=.+" "$env_file"; then state=present; else state=missing; fi
              printf 'shared_env_%s=%s\n' "$name" "$state"
            done
          fi
          fragment="$(systemctl show "$service" --property=FragmentPath --value 2>/dev/null || true)"
          printf 'business_unit_file=%s\n' "${fragment:-missing}"
          if [[ -n "$fragment" && -f "$fragment" ]]; then
            if grep -Fqx 'EnvironmentFile=/etc/apps/ensambria/core/.env' "$fragment"; then
              printf 'business_uses_shared_env=yes\n'
            else
              printf 'business_uses_shared_env=no\n'
            fi
          else
            printf 'business_uses_shared_env=unknown\n'
          fi
          [[ "$active" == active ]]
          [[ "$enabled" == enabled ]]
          [[ -n "$binary" && -x "$binary" ]]
          [[ -s "$env_file" ]]
          grep -Fqx 'EnvironmentFile=/etc/apps/ensambria/core/.env' "$fragment"
          for name in DATABASE_URL BUSINESS_DATABASE_URL CORE_DATABASE_MAX_CONNECTIONS CORE_DATABASE_ACQUIRE_TIMEOUT_MS CORE_PUBLIC_BASE_URL CORE_MFA_ENCRYPTION_KEY_VERSION CORE_MFA_ENCRYPTION_KEY_HEX CORE_AUTH_RATE_LIMIT_SECRET_HEX; do
            grep -qE "^${name}=.+" "$env_file"
          done
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:22100/health >/dev/null
          printf 'business_http_health=ok\n'
          REMOTE

      - name: Remove deployment SSH key
        if: always()
        run: rm -f -- "$HOME/.ssh/id_ed25519"
