[package]
name = "ensambria-shared-cache"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
redis = { version = "0.32.7", default-features = false, features = ["connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots", "cluster-async", "sentinel"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v7"] }
