name: ensambria-nats-jetstream-ha

services:
  nats-1:
    image: nats:2.11.8-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats-1.conf:/etc/nats/nats.conf:ro
      - nats-1-data:/data/jetstream
    ports:
      - "4222:4222"
      - "8222:8222"
    networks: [nats-ha]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 45

  nats-2:
    image: nats:2.11.8-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats-2.conf:/etc/nats/nats.conf:ro
      - nats-2-data:/data/jetstream
    ports:
      - "4223:4222"
      - "8223:8222"
    networks: [nats-ha]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 45

  nats-3:
    image: nats:2.11.8-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats-3.conf:/etc/nats/nats.conf:ro
      - nats-3-data:/data/jetstream
    ports:
      - "4224:4222"
      - "8224:8222"
    networks: [nats-ha]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 45

  nats-box:
    image: natsio/nats-box:0.17.0
    entrypoint: ["sh", "-c", "sleep infinity"]
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
    networks: [nats-ha]

networks:
  nats-ha:
    driver: bridge

volumes:
  nats-1-data:
  nats-2-data:
  nats-3-data:
