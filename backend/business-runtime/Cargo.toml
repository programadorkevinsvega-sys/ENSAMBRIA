[package]
name = "ensambria-business-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
ensambria-business = { path = "../business" }
ensambria-core = { path = "../core" }
ensambria-shared-cache = { path = "../shared-cache" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[[bin]]
name = "business"
path = "src/main.rs"
