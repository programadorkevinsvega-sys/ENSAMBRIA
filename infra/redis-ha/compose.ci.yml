name: ensambria-redis-ha

services:
  redis-master:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 6379 --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.10
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-replica:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 6379 --appendonly yes --replicaof redis-master 6379 --masterauth \"$$REDIS_PASSWORD\" --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      ha:
        ipv4_address: 172.29.0.11
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 2s
      retries: 30

  sentinel-1:
    image: redis:7.4-alpine
    command: ["sh", "-c", "printf 'port 26379\\nsentinel resolve-hostnames yes\\nsentinel announce-hostnames yes\\nsentinel monitor ensambria-master redis-master 6379 2\\nsentinel down-after-milliseconds ensambria-master 4000\\nsentinel failover-timeout ensambria-master 15000\\nsentinel parallel-syncs ensambria-master 1\\nsentinel auth-user ensambria-master default\\nsentinel auth-pass ensambria-master %s\\n' \"$$REDIS_PASSWORD\" > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      ha:
        ipv4_address: 172.29.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  sentinel-2:
    image: redis:7.4-alpine
    command: ["sh", "-c", "printf 'port 26379\\nsentinel resolve-hostnames yes\\nsentinel announce-hostnames yes\\nsentinel monitor ensambria-master redis-master 6379 2\\nsentinel down-after-milliseconds ensambria-master 4000\\nsentinel failover-timeout ensambria-master 15000\\nsentinel parallel-syncs ensambria-master 1\\nsentinel auth-user ensambria-master default\\nsentinel auth-pass ensambria-master %s\\n' \"$$REDIS_PASSWORD\" > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      ha:
        ipv4_address: 172.29.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  sentinel-3:
    image: redis:7.4-alpine
    command: ["sh", "-c", "printf 'port 26379\\nsentinel resolve-hostnames yes\\nsentinel announce-hostnames yes\\nsentinel monitor ensambria-master redis-master 6379 2\\nsentinel down-after-milliseconds ensambria-master 4000\\nsentinel failover-timeout ensambria-master 15000\\nsentinel parallel-syncs ensambria-master 1\\nsentinel auth-user ensambria-master default\\nsentinel auth-pass ensambria-master %s\\n' \"$$REDIS_PASSWORD\" > /tmp/sentinel.conf && exec redis-server /tmp/sentinel.conf --sentinel"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    networks:
      ha:
        ipv4_address: 172.29.0.14
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  cluster-1:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --cluster-announce-ip 172.29.0.21 --cluster-announce-port 7001 --cluster-announce-bus-port 17001"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.21

  cluster-2:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --cluster-announce-ip 172.29.0.22 --cluster-announce-port 7002 --cluster-announce-bus-port 17002"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.22

  cluster-3:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --cluster-announce-ip 172.29.0.23 --cluster-announce-port 7003 --cluster-announce-bus-port 17003"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.23

  cluster-4:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --cluster-announce-ip 172.29.0.24 --cluster-announce-port 7004 --cluster-announce-bus-port 17004"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.24

  cluster-5:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --cluster-announce-ip 172.29.0.25 --cluster-announce-port 7005 --cluster-announce-bus-port 17005"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.25

  cluster-6:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --port 7006 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --masterauth \"$$REDIS_PASSWORD\" --cluster-announce-ip 172.29.0.26 --cluster-announce-port 7006 --cluster-announce-bus-port 17006"]
    environment:
      REDIS_PASSWORD: ensambria-ci-only
    networks:
      ha:
        ipv4_address: 172.29.0.26

networks:
  ha:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
